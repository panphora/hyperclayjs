name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung step must fail fast and visibly. Without this, the browser install hanging on
    # Node 26 burned GitHub's 6h job ceiling on 15 consecutive pushes and reported as
    # "cancelled", which reads like someone stopped it rather than a broken build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # This repo does not commit package-lock.json (.gitignore), so use `npm install`
      # (not `npm ci`) and no npm cache. Byte-reproducibility of the goldens is still
      # guaranteed because `playwright` is exact-pinned in package.json.
      - run: npm install
      # Pinned Chromium for the byte-exact conformance goldens. The version is
      # locked by playwright in package.json, so CI and local produce the same bytes.
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests (jest)
        run: npm test
      - name: Conformance byte gate (web-test-runner)
        run: npm run test:conformance
